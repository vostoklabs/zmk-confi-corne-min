# Corne Min - left half power settings
#
# Why this file exists:
# The corne_min board module builds with deep sleep enabled (CONFIG_ZMK_SLEEP=y
# in corne_min_left_defconfig) and ZMK's stock timeout is 15 minutes. Step away
# for 20 minutes and the half powers itself off completely; coming back means a
# full boot plus BLE reconnect to the host and to the other half, which is the
# long wait before you can type again.
#
# The Diplomat48 builds on nice_nano_v2, which never enables CONFIG_ZMK_SLEEP at
# all - that is why it is always instantly ready.
#
# 12 hours instead of 15 minutes: it will never sleep during a normal day, but
# still powers down overnight so it is not draining the battery for nothing.
# Value is in milliseconds:
#    1 hour  =  3600000
#    4 hours = 14400000
#   12 hours = 43200000
#   24 hours = 86400000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=43200000

# To match the Diplomat48 exactly (never deep sleeps, ever), comment out the
# line above and uncomment this one instead:
# CONFIG_ZMK_SLEEP=n

# Keep this in sync with corne_min_right.conf - each half sleeps on its own
# timer, so the setting has to be applied to both.
